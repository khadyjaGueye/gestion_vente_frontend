<div class="container-register">
    <div class="card-register">
        <div class="left-panel">
            <div class="text-center mb-4">
                <img src="assets/img/Logo.png" alt="Logo" class="logo">
                <h4>Créer un compte</h4>
            </div>
            <form>
                <div class="mb-3">
                    <label for="username" class="form-label">Nom d'utilisateur</label>
                    <input type="text" class="form-control" id="username" placeholder="Entrez votre nom">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Entrez votre email">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Mot de passe</label>

                    <div class="d-flex justify-content-between align-items-center ">

                        <div class="input-group">
                            <input [type]="showPassword ? 'text' : 'password'" class="form-control" id="password"
                                placeholder="Entrez votre mot de passe">
                            <button class="btn btn-outline-secondary" type="button" (click)="togglePassword()">
                                <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-custom w-100">S'inscrire</button>
            </form>
        </div>

        <div class="right-panel">
            <h3>Bienvenue à bord !</h3>
            <p>Déjà inscrit ?</p>
            <a routerLink="/auth/login" class="btn btn-light">Se connecter</a>
        </div>
    </div>
</div>
