<app-navbar-component></app-navbar-component>

<div class="container py-5">
    <h2 class="fw-bold mb-4">
        Mon Panier 🛒
    </h2>

    <!-- Si panier vide -->
    <div *ngIf="cartService.getCartItems().length === 0" class="alert alert-warning">
        Votre panier est vide
    </div>

    <!-- Liste produits -->
    <div class="row g-4">

        <div class="col-md-6" *ngFor="let item of cartService.getCartItems(); let i = index">

            <div class="card shadow-sm h-100 cart-card">

                <div class="row g-0 h-100">

                    <!-- IMAGE -->
                    <div class="col-4">
                        <img [src]="item.image" class="cart-image">
                    </div>

                    <!-- CONTENT -->
                    <div class="col-8">
                        <div class="card-body d-flex flex-column h-100">

                            <div class="flex-grow-1">

                                <h5 class="fw-bold mb-1">
                                    {{ item.title }}
                                </h5>

                                <p class="text-muted small mb-2">
                                    {{ item.description }}
                                </p>

                                <h4 class="color-text fw-bold">
                                    {{ item.price }} FCFA
                                </h4>

                            </div>

                            <!-- ACTION -->
                            <div class="d-flex justify-content-between align-items-center mt-2">

                                <span class="badge bg-success">
                                    Ajouté
                                </span>

                                <button class="btn btn-danger btn-sm" (click)="cartService.removeItem(i)">
                                    Supprimer
                                </button>

                            </div>

                        </div>
                    </div>

                </div>

            </div>

        </div>

    </div>
    <!-- TOTAL -->
    <div class="d-flex justify-content-center mt-4"
     *ngIf="cartService.getCartItems().length > 0">

  <div class="card shadow-lg p-4 total-card">

      <div class="d-flex justify-content-between align-items-center">

          <h4 class="fw-bold mb-0">
              Total à payer
          </h4>

          <h3 class="text-success fw-bold mb-0">
              {{ cartService.getTotalPrice() | number:'1.0-0' }} FCFA
          </h3>

      </div>

      <button class="btn btn-payer w-100 mt-3 py-3 fw-bold">
          Payer maintenant
      </button>

  </div>

</div>

</div>
