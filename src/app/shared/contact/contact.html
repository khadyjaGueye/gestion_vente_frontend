<!-- CONTACT SECTION -->
<section class="contact-section py-5">
    <div class="container">
        <div class="contact-box mx-auto">
            <div class="row align-items-center">
                <!-- IMAGE -->
                <div class="col-lg-5 text-center mb-4 mb-lg-0">
                    <img src="assets/img/voile.png" class="contact-image img-fluid" alt="contact">
                </div>
                <!-- FORM -->
                <div class="col-lg-7">
                    <h2 class="contact-title text-color">
                        Contactez-Nous!
                    </h2>
                    <p class="contact-text mb-4 text-color">
                        Nous sommes là pour répondre à vos questions.
                    </p>
                    <form>  
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="text-color">Votre Nom</label>
                                <input type="text" class="form-control" placeholder="Entrez nom">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="text-color">Téléphone</label>
                                <input type="text" class="form-control" placeholder="Entrez numéro">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="text-color">Adresse E-mail</label>
                            <input type="email" class="form-control" placeholder="Entrez e-mail">
                        </div>

                        <div class="mb-4">
                            <label class="text-color">Message</label>
                            <textarea rows="5" class="form-control" placeholder="Votre message"></textarea>
                        </div>

                        <button class="contact-btn">
                            Envoyer
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>
</section>
